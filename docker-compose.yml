services:
  db:
    image: mysql:8.0
    container_name: campuscare-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_service_db
      MYSQL_USER: campuscare
      MYSQL_PASSWORD: campuscare123
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: campuscare-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      JWT_SECRET: campuscare-dev-secret
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: campuscare
      DB_PASSWORD: campuscare123
      DB_NAME: campus_service_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '5001:5000'

  frontend:
    build: ./frontend
    container_name: campuscare-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  mysql_data:
