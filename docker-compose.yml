version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: campuscare-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_service_db
      MYSQL_USER: campuscare
      MYSQL_PASSWORD: campuscare123
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: campuscare-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      JWT_SECRET: campuscare-dev-secret
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: campuscare
      DB_PASSWORD: campuscare123
      DB_NAME: campus_service_db
    depends_on:
      - db
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: campuscare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  mysql_data:
